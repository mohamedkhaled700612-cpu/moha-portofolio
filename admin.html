
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1f44">
  <title>MK | لوحة الإدارة</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: #f4f6fa;
      color: #0a1f44;
      font-family: inherit;
    }
    .admin-wrap {
      width: min(950px, 92%);
      margin: 55px auto;
    }
    .admin-header {
      background: #0a1f44;
      color: white;
      padding: 28px;
      border-radius: 18px;
      margin-bottom: 25px;
    }
    .admin-header h1 { margin: 0 0 8px; }
    .gold { color: #d4a017; }
    .admin-card {
      background: white;
      border: 1px solid #e5e9f0;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px #0a1f4410;
    }
    .admin-card h2 { margin-top: 0; }
    .admin-input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 12px 0;
      border: 1px solid #d9deea;
      border-radius: 9px;
      font: inherit;
    }
    .admin-btn {
      background: #0a1f44;
      color: white;
      border: 0;
      border-radius: 9px;
      padding: 13px 22px;
      font: inherit;
      cursor: pointer;
    }
    .admin-btn:hover { background: #173665; }
    #loginStatus { margin-top: 12px; }
    #requestsArea { margin-top: 20px; }
  </style>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
  <main class="admin-wrap">
    <header class="admin-header">
      <h1><span class="gold">MK</span> لوحة الإدارة</h1>
      <p>إدارة طلبات المشاريع ومتابعة العملاء</p>
    </header>

    <section class="admin-card" id="loginCard">
      <h2>تسجيل دخول الإدارة</h2>
      <form id="adminLoginForm">
        <input class="admin-input" type="email"
          id="adminEmail" placeholder="البريد الإلكتروني"
          autocomplete="username" required>
        <input class="admin-input" type="password"
          id="adminPassword" placeholder="كلمة المرور"
          autocomplete="current-password" required>
        <button class="admin-btn" type="submit">تسجيل الدخول</button>
      </form>
      <p id="loginStatus" role="status"></p>
    </section>

    <section class="admin-card" id="dashboard" hidden>
      <h2>طلبات المشاريع</h2>
      <p id="adminWelcome"></p>
      <button class="admin-btn" id="enableNotificationsBtn" type="button">
  تفعيل إشعارات الطلبات
</button>
<p id="notificationStatus" role="status"></p>
      <button class="admin-btn" id="logoutBtn" type="button">
        تسجيل الخروج
      </button>
      <div id="requestsArea">
        <p>سيتم عرض الطلبات هنا بعد ربط Firebase.</p>
      </div>
    </section>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
